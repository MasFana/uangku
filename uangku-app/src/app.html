<!doctype html>
<html lang="id">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#007B4F" />
	<link rel="manifest" href="/manifest.json" />
	<meta name="description"
		content="Uangku mencatat pemasukan dan pengeluaran harian dalam rupiah. Data tersimpan di perangkat Anda, lalu disinkronkan saat online. Gratis, tanpa iklan." />
	<meta name="format-detection" content="telephone=no" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="Uangku" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
		rel="stylesheet" />
	<script>
		try {
			const theme = localStorage.getItem('uangku-theme') || 'system';
			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (theme === 'dark' || (theme === 'system' && prefersDark)) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		} catch (_) { }
	</script>
	%sveltekit.head%
</head>

<!-- data-impeccable-ignore: kanvas hangat (cream) adalah token resmi DESIGN.md §3 --color-canvas, bukan default refleks. -->
<body data-impeccable-ignore="cream-palette" data-sveltekit-preload-data="hover" class="min-h-screen bg-canvas text-content antialiased">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
