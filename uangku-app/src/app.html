<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Aplikasi pencatatan keuangan pribadi cepat, ringan, dan mandiri di Cloudflare Workers." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const theme = localStorage.getItem('uangku-theme') || 'system';
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (theme === 'system' && prefersDark)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-canvas text-content antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
